model:
  name: CNNModel
  base_channels: 32
  expander_dim: 2048
optimizer:
  name: sgd
  learning_rate: 0.001
  weight_decay: 0.05
scheduler:
  name: stepLR
  step_size: 15
  gamma: 0.1
debug_subset_size: null
seed: 42
batch_size: 64
data_dir: ${hydra:runtime.cwd}/data
num_epochs: 10
augmentation:
  apply_augmentation: true
  rotation_angle: 15
  translate_fraction: 0.1
  blur_kernel_size: 3
  blur_possibility: 0.5
loss:
  lambda_inv: 1.0
  lambda_var: 1.0
  lambda_shape: 1.0
